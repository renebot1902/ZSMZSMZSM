    ${extra}<label class="f">Datum<input class="in" type="date" name="datum" value="${d.datum}"></label><label class="f">Beginn<input class="in" type="time" name="zeit" value="${d.zeit}"></label>

function mMagVerlauf(M){
  const p = P(M.id); if(!p) return null;
  const list = DB.termine.filter(x => x.kat === 'mag' && x.pid === p.id).sort(byDT).reverse();

    r.onload = () => { try { const d = JSON.parse(r.result); if(!Array.isArray(d.personen) || !Array.isArray(d.termine)) throw new Error('Keine gültige Sicherungsdatei');
        if(!confirm(`Sicherung mit ${d.personen.length} Personen und ${d.termine.length} Terminen einspielen? Die aktuellen Daten werden ersetzt.`)) return;
        DB = d; migrate(); save(true); render(); toast('Sicherung eingespielt'); } catch(e){ toast('Import fehlgeschlagen: ' + e.message, true); } };
    r.readAsText(f); el.value = ''; }
};

/* Daten-Bindung: Eingaben in den Detailfenstern speichern automatisch */
function resolve(bind){
  const parts = bind.split('.'), col = parts.shift(); let obj;
  if(col === 'settings') obj = DB.settings; else { const id = parts.shift(); obj = (DB[col] || []).find(x => x.id === id); }
  const key = parts.pop();
  for(const seg of parts){ if(!obj) return null; if(seg[0] === '#') obj = obj.find(x => x.id === seg.slice(1)); else { if(obj[seg] == null) obj[seg] = {}; obj = obj[seg]; } }
  return obj ? {obj, key} : null;
}
function bindValue(el, isChange){
  const r = resolve(el.dataset.bind); if(!r) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if(el.dataset.type === 'num') v = v === '' ? '' : Number(v);
  r.obj[r.key] = v;
  const [col, id] = el.dataset.bind.split('.');
  if(col === 'termine' && r.key === 'status' && v === 'erledigt'){ const t = T(id);
    if(t && t.kat === 'mag'){ const p = P(t.pid); if(p && (!p.letzteMAG || p.letzteMAG < t.datum)){ p.letzteMAG = t.datum; toast(`Letztes Gespräch von ${pshort(p)} auf ${fmtD(t.datum)} gesetzt`); } } }
  save();
  if(el.type === 'range'){ const lab = $('#fsVal'); if(lab) lab.textContent = v + '%'; }
  if(!isChange) return;
  if(el.tagName === 'SELECT' || el.type === 'checkbox'){ if(MODAL && el.closest('#modalRoot')) renderModal(); render(); }
  else if(r.key === 'datum' && $('#datWarn')){ const t = T(id); $('#datWarn').innerHTML = t && t.status === 'geplant' ? dateWarn(v) : ''; }
}

/* Suche */
function doSearch(q){
  const box = $('#searchResults'); q = q.trim().toLowerCase();
  if(q.length < 2){ box.classList.remove('open'); box.innerHTML = ''; return; }
  const res = [], has = s => String(s || '').toLowerCase().includes(q);
  DB.personen.forEach(p => { if(has(pname(p) + ' ' + p.funktion + ' ' + p.station)) res.push({k:'Person', t:pname(p), s:p.funktion, a:'openPerson', id:p.id}); });
  DB.projekte.forEach(p => { if(has(p.name + ' ' + p.ziel)) res.push({k:'Projekt', t:p.name, s:pshort(P(p.pid)), a:'openProjekt', id:p.id}); });
  DB.termine.slice().sort(byDT).reverse().forEach(t => { if(has([titleOf(t), t.ort, t.protokoll, refPlain(t), ...t.tops.map(x => x.text)].join(' '))) res.push({k:KAT[t.kat].short, t:titleOf(t), s:fmtD(t.datum), a:'openTermin', id:t.id}); });
  DB.todos.forEach(x => { if(has(x.text + ' ' + x.notiz)) res.push({k:'Aufgabe', t:x.text, s:x.erledigt ? 'erledigt' : (x.frist ? 'bis ' + fmtD(x.frist) : ''), a:'openTodo', id:x.id}); });
  box.innerHTML = res.slice(0, 14).map(r => `<button class="sr-item" data-act="searchPick" data-a="${r.a}" data-id="${r.id}"><span class="sr-k">${esc(r.k)}</span><span><span class="sr-t">${esc(r.t)}</span> <span class="sr-s">${esc(r.s || '')}</span></span></button>`).join('') || '<div class="sr-empty">Keine Treffer.</div>';
  box.classList.add('open');
}

/* ---------- 9  Export & Druck ---------- */
function download(name, content, type){
  const blob = new Blob([content], {type:type + ';charset=utf-8'}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsFold = l => { if(l.length <= 70) return l; const out = []; while(l.length > 70){ out.push(l.slice(0, 70)); l = l.slice(70); } out.push(l); return out.join('\r\n '); };
function vevent(t){
  const [y, m, d] = t.datum.split('-').map(Number), [hh, mi] = (t.zeit || '09:00').split(':').map(Number);
  const start = new Date(y, m-1, d, hh, mi), end = new Date(start.getTime() + (Number(t.dauer) || 60) * 60000);
  const u = dt => dt.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
  const desc = [];
  if(t.kat === 'fortbildung'){ const r = refPlain(t); if(r) desc.push('Referent:in: ' + r); if(t.fb.dfp) desc.push('DFP-Punkte: ' + t.fb.dfp); }
  if(t.tops.length){ desc.push('Tagesordnung:'); t.tops.forEach((x, i) => desc.push(`${i+1}. ${x.text}`)); }
  const alarm = Number(DB.settings.icsAlarm) || 0;
  return ['BEGIN:VEVENT', `UID:${t.id}@zsm-organisation`, `DTSTAMP:${u(new Date())}`, `DTSTART:${u(start)}`, `DTEND:${u(end)}`, `SUMMARY:${icsEsc(titleOf(t))}`,
    t.ort ? `LOCATION:${icsEsc(t.ort)}` : '', desc.length ? `DESCRIPTION:${icsEsc(desc.join('\n'))}` : '', `CATEGORIES:${icsEsc(KAT[t.kat].label)}`,
    t.status === 'abgesagt' ? 'STATUS:CANCELLED' : 'STATUS:CONFIRMED',
    ...(alarm ? ['BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Erinnerung', `TRIGGER:-PT${alarm}M`, 'END:VALARM'] : []), 'END:VEVENT'].filter(Boolean).map(icsFold).join('\r\n');
}
const icsFile = evs => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ZSM Organisation//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', ...evs, 'END:VCALENDAR'].join('\r\n') + '\r\n';
function printTermin(t){
  const k = KAT[t.kat], tn = t.teilnehmer, todos = DB.todos.filter(x => x.src && x.src.id === t.id);
  const names = st => tn.filter(x => x.st === st).map(x => esc(pname(P(x.pid)))).join(', ') || '–';
  let b = `<h1>${esc(titleOf(t))}</h1><p>${esc(k.label)} · ${fmtLong(t.datum)} · ${t.zeit} Uhr${t.ort ? ' · ' + esc(t.ort) : ''}</p>`;
  if(t.kat === 'fortbildung') b += `<p><b>Referent:in:</b> ${esc(refPlain(t) || '–')}${t.fb.refInst ? ' (' + esc(t.fb.refInst) + ')' : ''} · <b>DFP-Punkte:</b> ${t.fb.dfp || '–'}</p>`;
  if(t.kat === 'mag'){ const m = t.mag; [['rueckblick','Rückblick'],['zielerreichung','Zielerreichung'],['wuensche','Fortbildungswünsche'],['karriere','Entwicklung & Karriere'],['feedback','Feedback an die Führung']].forEach(([f, l]) => { if(m[f]) b += `<h2>${l}</h2><div class="pre">${esc(m[f])}</div>`; });
    if(m.ziele.length) b += `<h2>Ziele für das kommende Jahr</h2><ol>${m.ziele.map(z => `<li>${esc(z.text)}</li>`).join('')}</ol>`; if(m.vereinbarungen) b += `<h2>Vereinbarungen</h2><div class="pre">${esc(m.vereinbarungen)}</div>`; }
  if(tn.length && t.kat !== 'mag') b += `<h2>Teilnehmende</h2><p><b>Anwesend:</b> ${names('anwesend')}</p><p><b>Entschuldigt:</b> ${names('entschuldigt')}</p>`;
  if(t.tops.length) b += `<h2>Tagesordnung</h2><ol>${t.tops.map(x => `<li>${esc(x.text)}</li>`).join('')}</ol>`;
  if(t.protokoll) b += `<h2>${t.kat === 'mag' ? 'Notizen' : 'Protokoll'}</h2><div class="pre">${esc(t.protokoll)}</div>`;
  if(todos.length) b += `<h2>Aufgaben & Vereinbarungen</h2><table><tr><th>Aufgabe</th><th>Verantwortlich</th><th>Frist</th><th>Status</th></tr>${todos.map(x => `<tr><td>${esc(x.text)}</td><td>${esc(pshort(P(x.pid)))}</td><td>${fmtD(x.frist)}</td><td>${x.erledigt ? 'erledigt' : 'offen'}</td></tr>`).join('')}</table>`;
  $('#printArea').innerHTML = `<div class="print-doc"><div class="pb">ZSM · Primariat</div>${b}<div class="pf">Ausgedruckt am ${fmtD(todayISO())}</div></div>`;
  document.body.classList.add('printing'); window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));

/* ---------- 10  Start & Ereignisse ---------- */
document.addEventListener('click', e => {
  if(e.target.classList.contains('modal-backdrop')) return closeModal();
  if(!e.target.closest('.new-wrap')) closeMenus();
  if(!e.target.closest('.search')) $('#searchResults').classList.remove('open');
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  if(el.tagName !== 'INPUT') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('input', e => { const el = e.target; if(el.dataset.bind) bindValue(el, false); if(el.id === 'search') doSearch(el.value); });
document.addEventListener('change', e => { const el = e.target; if(el.dataset.bind) bindValue(el, true); else if(el.dataset.onchange && CHANGE[el.dataset.onchange]) CHANGE[el.dataset.onchange](el); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if($('#searchResults').classList.contains('open')){ $('#searchResults').classList.remove('open'); return; } if(MODAL) return closeModal(); document.body.classList.remove('drawer-open'); closeMenus(); }
  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.enter && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); const fn = ACT[e.target.dataset.enter]; if(fn) fn(e.target.dataset, e.target, e); }
});
window.addEventListener('hashchange', () => { document.body.classList.remove('drawer-open'); render(); });

function init(){
  DB = load();
  if(!DB){ seed(); migrate(); save(true); } else migrate();
  const t = todayISO();
  if(genSeries(firstOfMonth(t), 13, t)) save(true);
  const d = new Date(); VS.cal = {y:d.getFullYear(), m:d.getMonth(), sel:t}; VS.fbYear = t.slice(0,4);
  $('#newMenu').innerHTML = [['newTermin','calendar','Termin'],['newTodo','aufgaben','Aufgabe'],['newProjekt','projekte','Projekt'],['newPerson','personen','Person']]
    .map(([a, i, l]) => `<button data-act="${a}">${icon(i)}${l}</button>`).join('');
  render();
  if('Notification' in window && Notification.permission === 'granted' && DB.meta.notified !== t){
    const n = agenda(t, t).filter(a => a.status !== 'abgesagt').length, iss = issues().filter(i => i.sev !== 'info').length;
    try { new Notification('ZSM Organisation', {body:`Heute: ${n} Termin${n === 1 ? '' : 'e'} · ${iss} Punkt${iss === 1 ? '' : 'e'} mit Handlungsbedarf`}); DB.meta.notified = t; save(); } catch(e){}
  }
}
init();
</script>
