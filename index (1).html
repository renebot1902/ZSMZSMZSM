<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2E33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZSM Org">
<meta name="robots" content="noindex, nofollow">
<title>ZSM Organisation</title>
<style>
/* =========================================================
   ZSM Organisation – Design-Grundlagen
   ========================================================= */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --surface-2:#F8F7F3; --ink:#16212B; --ink-2:#3A4651; --muted:#6E7781;
  --line:#E3E1DA; --line-2:#ECEAE4;
  --accent:#0E5A60; --accent-soft:#DDEDEC;
  --side:#0F2E33; --side-ink:#BFD0D0;
  --red:#B8402F; --red-soft:#F8E4DF; --amber:#B7790D; --amber-soft:#FBEFD6; --green:#2D7A4F; --green-soft:#E1F1E6; --blue:#2F5D9E; --blue-soft:#E3EBF6;
  --r:12px; --shadow:0 1px 2px rgba(16,24,32,.05),0 4px 16px rgba(16,24,32,.045); --shadow-lg:0 24px 60px rgba(10,20,30,.25);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-size:14.5px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.ic{width:18px;height:18px;flex:none}
.ic.sm{width:13px;height:13px}
.muted{color:var(--muted)} .small{font-size:12.5px} .block{display:block} .right{text-align:right} .num{text-align:right;font-variant-numeric:tabular-nums} .grow{flex:1}
.link{color:var(--accent);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none;cursor:pointer;margin:0}

/* ---------- Layout ---------- */
.app{min-height:100vh;padding-left:252px}
.sidebar{background:var(--side);color:var(--side-ink);position:fixed;left:0;top:0;bottom:0;width:252px;z-index:40;overflow-y:auto;padding:22px 14px 18px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#2C8582,#0A4449);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:.6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.brand-name{color:#fff;font-weight:650;font-size:15px;line-height:1.15}
.brand-sub{font-size:11.5px;color:#88A3A5}
.nav-group{margin-top:8px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:#6C898C;padding:10px 10px 5px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:8px;color:var(--side-ink);font-size:14px;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(255,255,255,.11);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#5FC4C0}
.nav-badge{margin-left:auto;background:#C2513F;color:#fff;font-size:11px;font-weight:650;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;font-size:11.5px;color:#6C898C;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.08);line-height:1.5}
.side-foot button{color:#9FC2C1;font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:13px 28px;background:rgba(243,242,238,.9);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:var(--green);opacity:0;transition:opacity .35s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.saved.on{opacity:1}
.search{position:relative;margin-left:auto;width:min(320px,36vw)}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search>.ic{position:absolute;left:11px;top:10px;color:var(--muted)}
.sr{position:absolute;top:44px;left:0;right:0;min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);display:none;max-height:60vh;overflow:auto;padding:6px;z-index:50}
.sr.open{display:block}
.sr-item{display:flex;gap:10px;align-items:baseline;width:100%;padding:8px 10px;border-radius:8px}
.sr-item:hover{background:var(--surface-2)}
.sr-k{font-size:11px;color:var(--muted);min-width:84px;font-weight:600}
.sr-t{font-size:13.5px;font-weight:550}
.sr-s{font-size:12px;color:var(--muted)}
.sr-empty{padding:14px;color:var(--muted);font-size:13px}
.view{padding:26px 28px 120px;max-width:1320px;width:100%}
.icon-btn.only-mobile{display:none}
.scrim{display:none}
.show-sm{display:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#CBC7BC}
.btn .ic{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0A4C51}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:rgba(0,0,0,.055)}
.icon-btn.danger:hover{background:var(--red-soft);color:var(--red)}
.icon-btn.sm{width:28px;height:28px}
.icon-btn.sm .ic{width:15px;height:15px}
.x{width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.x .ic{width:14px;height:14px}
.x:hover{background:var(--red-soft);color:var(--red)}
.new-wrap{position:relative}
.new-menu{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:220px;display:none;z-index:40}
.new-wrap.open .new-menu{display:block}
.new-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-size:13.5px}
.new-menu button:hover{background:var(--surface-2)}

/* ---------- Karten, Pills, Tabs ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.card-h h3{font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.card-b{padding:4px 18px 18px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;border-radius:999px;padding:2px 9px;background:var(--line-2);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:#8A5B07} .pill.green{background:var(--green-soft);color:var(--green)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
.kat-badge{display:inline-flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:650;color:var(--c);background:var(--cs);padding:5px 11px;border-radius:999px;white-space:nowrap}
.kat-badge .ic{width:15px;height:15px}
.tabs{display:inline-flex;gap:2px;padding:3px;background:#E8E6E0;border-radius:10px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.09)}
.tab .count{font-size:11px;color:var(--muted);font-weight:600}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.rule{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14px}
.rule .ic{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.grid-2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.grid-ms{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.grid-3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px;align-items:start;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:18px}

/* ---------- Übersicht ---------- */
.hero{margin-bottom:22px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:650}
.greet{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:-.01em;margin:6px 0;line-height:1.12}
.lede{margin:0;color:var(--ink-2);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.04),0 10px 24px rgba(0,0,0,.07)}
.kpi-label{font-size:11.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.09em}
.kpi-val{font-size:30px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-val small{font-size:16px;color:var(--muted);font-weight:500}
.kpi-sub{font-size:12.5px;color:var(--muted)}
.kpi-sub.bad{color:var(--red);font-weight:650}
.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;margin:6px 0 2px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.lg{height:10px}
.agenda{display:flex;flex-direction:column}
.ag-day{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.ag-day:first-child{border-top:0;padding-top:2px}
.ag-date b{display:block;font-size:13px}
.ag-date em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.ag-date em.hol{color:var(--red);font-weight:600}
.ag-date.today b{color:var(--accent)}
.ag-items{display:flex;flex-direction:column;gap:6px;min-width:0}
.ag-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:9px;background:var(--surface-2);border-left:3px solid var(--c);width:100%;min-width:0}
.ag-item:hover{background:#F0EEE7}
.ag-time{font-variant-numeric:tabular-nums;font-size:13px;font-weight:650;width:42px;color:var(--ink-2);flex:none;display:flex}
.ag-time .ic{width:15px;height:15px;color:var(--muted)}
.ag-main{display:flex;flex-direction:column;min-width:0;flex:1}
.ag-title{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-item.erledigt .ag-title{text-decoration:line-through;color:var(--muted)}
.ag-item.abgesagt{opacity:.5}
.ag-flag{font-size:11.5px;font-weight:650;color:var(--amber);display:flex;align-items:center;gap:4px;white-space:nowrap}
.ag-flag .ic{width:14px;height:14px}
.issues{display:flex;flex-direction:column;gap:6px}
.issue{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:9px;width:100%;background:var(--surface-2)}
.issue:hover{background:#F0EEE7}
.issue .ic{margin-top:1px}
.issue.high .ic{color:var(--red)} .issue.mid .ic{color:var(--amber)} .issue.info .ic{color:var(--blue)}
.issue b{display:block;font-size:13.5px;font-weight:600}
.issue small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.more-btn{display:block;width:100%;text-align:center;padding:8px;font-size:12.5px;color:var(--accent);font-weight:600}

/* ---------- Besprechungen ---------- */
.mlist{display:flex;flex-direction:column;gap:8px}
.mcard{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;transition:border-color .15s,box-shadow .15s}
.mcard:hover{border-color:#CBC7BC;box-shadow:var(--shadow)}
.datebox{width:54px;flex:none;text-align:center;border-radius:10px;background:var(--cs);color:var(--c);padding:6px 0}
.datebox .d{display:block;font-size:20px;font-weight:700;line-height:1.05}
.datebox .m{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mbody{flex:1;min-width:0}
.mtitle{font-weight:620;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mmeta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.mmeta span{display:inline-flex;align-items:center;gap:4px}
.mmeta .ic{width:14px;height:14px}
.rel{font-size:12px;color:var(--muted);white-space:nowrap}
.mcard.abgesagt{opacity:.55}
.mcard.abgesagt .mtitle{text-decoration:line-through}
.members{display:flex;flex-wrap:wrap;gap:6px}
.member{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 3px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none;letter-spacing:.02em}
.avatar.xs{width:22px;height:22px;font-size:9.5px}
.avatar.lg{width:46px;height:46px;font-size:15px}

/* ---------- Kalender ---------- */
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.cal-head h2{font-family:var(--serif);font-size:26px;margin:0 10px 0 4px;font-weight:600;min-width:190px}
.legend{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface-2);border-bottom:1px solid var(--line)}
.cal-wd div{padding:8px 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-cell{min-height:108px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:5px 5px 7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:#FCFBF8}
.cal-cell.we{background:#FAF9F5}
.cal-cell.out{background:#F6F5F1}
.cal-cell.out .cal-num b{color:#B3AFA6}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-cell.hol{background:#FCF4F2}
.cal-num{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:1px 3px;gap:4px;min-width:0}
.cal-num b{font-weight:650;min-width:22px;height:22px;display:inline-grid;place-items:center;border-radius:999px;flex:none}
.cal-num small{font-size:10px;color:var(--red);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cell.today .cal-num b{background:var(--accent);color:#fff;padding:0 5px}
.chip{display:block;width:100%;font-size:11.5px;padding:2px 6px;border-radius:5px;background:var(--cs);color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.chip:hover{filter:brightness(.96)}
.chip.erledigt{opacity:.6}
.chip.abgesagt{text-decoration:line-through;opacity:.45}
.chip b{font-weight:750;margin-right:3px}
.more{font-size:11px;color:var(--muted);padding-left:6px;font-weight:600}
.cal-dots{display:none}

/* ---------- Formulare ---------- */
.in{height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 11px;outline:none;width:100%;font-size:14px;font-weight:400;color:var(--ink);min-width:0}
textarea.in{height:auto;min-height:80px;padding:9px 11px;resize:vertical;line-height:1.5}
select.in{padding-right:6px}
.in.sm{height:30px;font-size:12.5px;width:auto;padding:0 8px;border-radius:8px}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.span2{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:650;color:var(--ink-2);min-width:0}
.hint{font-weight:400;color:var(--muted);font-size:12px}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;cursor:pointer;padding:5px 0}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row .in{height:34px}
.add-row textarea.in{height:auto;min-height:60px}
.seg{display:inline-flex;background:#E9E7E1;border-radius:8px;padding:2px;gap:1px;flex:none}
.seg button{font-size:11.5px;padding:3px 8px;border-radius:6px;color:var(--muted);font-weight:650;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.09)}
.seg button.on.st-anwesend{color:var(--green)} .seg button.on.st-entschuldigt{color:var(--amber)}
.seg.lg button{font-size:13px;padding:6px 12px}

/* ---------- Modal / Seitenpanel ---------- */
body.modal-open{overflow:hidden}
.modal-backdrop{position:fixed;inset:0;background:rgba(14,24,30,.42);z-index:100;display:flex;justify-content:flex-end;animation:fade .15s ease-out}
.modal-backdrop.center{justify-content:center;align-items:center;padding:20px}
.modal{width:min(780px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .22s ease-out}
.modal.dialog{width:min(580px,100%);height:auto;max-height:92vh;border-radius:16px;overflow:hidden;animation:pop .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.m-head{display:flex;align-items:center;gap:10px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.m-head h3{font-size:16px;font-weight:650}
.m-actions{margin-left:auto;display:flex;gap:2px}
.m-body{flex:1;overflow-y:auto;padding:20px 22px 48px}
.m-foot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);flex:none}
.title-input{width:100%;font-size:25px;font-weight:600;border:0;background:transparent;outline:none;padding:4px 0;font-family:var(--serif);letter-spacing:-.01em;border-bottom:1px dashed transparent;color:var(--ink)}
.title-input:hover{border-bottom-color:var(--line)}
.title-input:focus{border-bottom-color:var(--accent)}
.m-title{font-family:var(--serif);font-size:25px;font-weight:600;margin:4px 0;letter-spacing:-.01em}
.meta-grid{display:grid;grid-template-columns:150px 108px 100px minmax(0,1fr) 130px;gap:10px;margin:14px 0 4px}
.meta-grid.proj{grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr)) 130px}
.m-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.m-sec h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
.m-sec h4 small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);margin-left:8px;font-size:12px}
.m-sec.prev{background:var(--blue-soft);border-color:transparent}
.warn{display:flex;gap:8px;align-items:center;background:var(--amber-soft);color:#7A5106;padding:9px 12px;border-radius:9px;font-size:13px;margin-top:10px;font-weight:600}
.warn .ic{width:16px;height:16px}
.note{background:var(--blue-soft);color:#24477A;padding:10px 12px;border-radius:9px;font-size:13px;line-height:1.5}
.tn-list{display:grid;grid-template-columns:1fr;gap:5px}
.tn{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 5px;border-radius:9px;background:var(--surface-2);min-width:0}
.tn-name{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tops{list-style:none;margin:0;padding:0;counter-reset:top;display:flex;flex-direction:column;gap:2px}
.tops li{display:flex;align-items:center;gap:8px;counter-increment:top;padding:2px 4px;border-radius:8px}
.tops li::before{content:counter(top) ".";width:20px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:650;flex:none}
.tops li:hover{background:var(--surface-2)}
.tops li.done .inline{text-decoration:line-through;color:var(--muted)}
.inline{flex:1;border:0;background:transparent;outline:none;padding:6px 7px;border-radius:6px;font-size:14px;min-width:0}
.inline:hover{background:var(--surface-2)}
.inline:focus{background:#fff;box-shadow:0 0 0 1px var(--line)}
.th-list{display:flex;flex-direction:column;gap:6px}
.th{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 10px;border-radius:9px;background:var(--surface-2);font-size:13.5px}
.person-strip{display:flex;align-items:center;gap:14px}
.person-strip b{display:block;font-size:15px}
.person-strip small{color:var(--muted);font-size:12.5px}
.ps-meta{margin-left:auto;text-align:right}
.ps-meta small{display:block}
.goals{margin:0;padding-left:20px}
.goals li{margin:3px 0}
.goal-list{display:flex;flex-direction:column;gap:2px}
.goal{display:flex;align-items:center;gap:6px}
.goal::before{content:"→";color:var(--accent);font-weight:700;padding-left:4px}
.proj-status{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.lbl{display:block;font-size:12px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px 4px 3px 3px;font-size:13px}
.ms-list{display:flex;flex-direction:column;gap:2px}
.ms{display:flex;align-items:center;gap:8px;padding:2px 4px;border-radius:8px}
.ms:hover{background:var(--surface-2)}
.ms .in.sm{width:150px;flex:none}
.ms.done .inline{text-decoration:line-through;color:var(--muted)}
.timeline{display:flex;flex-direction:column;margin-top:12px}
.tl{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);align-items:start}
.tl-date{font-size:12.5px;font-weight:650;color:var(--muted)}
.tl p{margin:0;font-size:13.5px;white-space:pre-wrap}

/* ---------- Aufgaben ---------- */
.todo-list{display:flex;flex-direction:column}
.todo{display:flex;align-items:flex-start;gap:11px;padding:9px 6px}
.todo + .todo{border-top:1px solid var(--line-2)}
.todo input{margin-top:2px}
.todo-main{flex:1;min-width:0}
.todo-text{font-size:13.5px;font-weight:600;display:block}
.todo-meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.todo-meta>span{display:inline-flex;align-items:center;gap:4px}
.todo-meta .ic{width:13px;height:13px}
.todo.done .todo-text{text-decoration:line-through;color:var(--muted);font-weight:500}
.todo.overdue .due{color:var(--red);font-weight:650}
.src{color:var(--c,var(--accent));font-weight:650;font-size:12px}
.src:hover{text-decoration:underline}
.add-todo{display:grid;grid-template-columns:minmax(0,1fr) 180px 145px auto;gap:8px;margin-top:10px}
.add-todo .in{height:34px}

/* ---------- Projekte ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);width:100%;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:#CBC7BC;transform:translateY(-1px)}
.pc-top{display:flex;align-items:center;gap:10px}
.pc-top h4{font-size:15.5px;font-weight:650;line-height:1.25}
.ampel{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--as)}
.a-gruen{background:var(--green);--as:var(--green-soft)} .a-gelb{background:#D9A21B;--as:var(--amber-soft)} .a-rot{background:var(--red);--as:var(--red-soft)}
.pc-ziel{margin:0;color:var(--ink-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.pc-next{font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.pc-next.over{background:var(--red-soft);color:var(--red);font-weight:600}
.pc-wv{font-size:12px;color:var(--amber);font-weight:650;display:flex;gap:5px;align-items:center}
.pc-wv .ic{width:14px;height:14px}

/* ---------- Zeitleiste ---------- */
.tl-card{margin-top:22px}
.tl-card .card-h{flex-wrap:wrap}
.tl-period{font-family:var(--serif);font-size:18px;font-weight:600;margin-left:6px}
.tl-scroll{overflow-x:auto;padding:4px 18px 4px}
.tlc{position:relative}
.tl-head{position:relative;height:32px;border-bottom:1px solid var(--line)}
.tl-mon{position:absolute;top:0;bottom:0;padding:7px 8px;font-size:12px;font-weight:650;color:var(--ink-2);border-left:1px solid var(--line-2);white-space:nowrap;overflow:hidden}
.tl-mon small{color:var(--muted);font-weight:500;margin-left:4px}
.tl-body{position:relative;padding-bottom:26px}
.tl-line{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-2);pointer-events:none}
.tl-today{position:absolute;top:-32px;bottom:0;border-left:2px dashed var(--red);z-index:3;pointer-events:none}
.tl-today span{position:absolute;bottom:4px;left:-18px;font-size:10.5px;font-weight:700;color:#fff;background:var(--red);padding:1px 5px;border-radius:4px}
.tl-row{position:relative;height:48px;border-bottom:1px solid var(--line-2)}
.tl-row:last-of-type{border-bottom:0}
.tl-bar{position:absolute;top:9px;height:30px;border-radius:7px;border:1px solid var(--bc);background:var(--bg1);color:var(--tc);overflow:hidden;display:flex;align-items:center;z-index:1}
.tl-bar:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.tl-prog{position:absolute;left:0;top:0;bottom:0;background:var(--bg2)}
.tl-lbl{position:relative;padding:0 10px;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl-lbl small{font-weight:500;opacity:.8;margin-left:6px}
.tl-bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;border-left-style:dashed}
.tl-bar.cr,.tl-bar.open{border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:dashed}
.tl-bar.pausiert{opacity:.55}
.b-gruen{--bc:#8CC7A1;--bg1:#EDF7F0;--bg2:#C6E4CF;--tc:#1E5A37}
.b-gelb{--bc:#E2C27A;--bg1:#FDF6E6;--bg2:#F4DDA4;--tc:#6E4A06}
.b-rot{--bc:#DE9C8F;--bg1:#FCEFEC;--bg2:#F0C5BC;--tc:#862C1F}
.tl-out{position:absolute;top:15px;font-size:12.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;z-index:1}
.tl-off{position:absolute;top:15px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tl-off:hover{color:var(--accent)}
.tl-ms{position:absolute;top:32px;width:13px;height:13px;margin-left:-6.5px;transform:rotate(45deg);border:2px solid #fff;z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.tl-ms.done{background:var(--green)} .tl-ms.offen{background:#D9A21B} .tl-ms.over{background:var(--red)}
.tl-ms:hover{transform:rotate(45deg) scale(1.25)}
.tl-legend{display:flex;gap:16px;flex-wrap:wrap;padding:6px 18px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2)}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}
.tl-legend .d{width:9px;height:9px;transform:rotate(45deg);display:inline-block}
.tl-legend .b{width:16px;height:9px;border-radius:3px;display:inline-block;border:1px solid var(--bc);background:var(--bg2)}

/* ---------- Tabellen ---------- */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tr.click{cursor:pointer}
.table tr.click:hover td{background:var(--surface-2)}
.table tr.abgesagt td{opacity:.5}
.table td .actions{justify-content:flex-end;flex-wrap:nowrap}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:600}
.who small{display:block;color:var(--muted);font-size:12px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.rot-list{display:flex;flex-direction:column}
.rot{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13px}
.rot:first-child{border-top:0}
.rot span.grow{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rot small{color:var(--muted);white-space:nowrap}

/* ---------- Jour fixe ---------- */
.partner-head{display:flex;align-items:center;gap:16px;padding:18px 20px 14px;flex-wrap:wrap}
.partner-head h2{font-family:var(--serif);font-size:24px;font-weight:600}
.partner-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.partner-next{margin-left:auto;text-align:right;font-size:13px}
.partner-next b{display:block;font-size:15px}
.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 20px 18px}
.q{border-radius:10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line-2)}
.q b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.q span{font-size:13.5px;font-weight:650}
.q.ok{background:var(--green-soft);border-color:transparent} .q.ok span{color:var(--green)}
.q.plan{background:var(--blue-soft);border-color:transparent} .q.plan span{color:var(--blue)}
.q.miss{background:var(--red-soft);border-color:transparent} .q.miss span{color:var(--red)}
.q.cur{outline:2px solid var(--ink-2);outline-offset:1px}
.thema{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-top:1px solid var(--line-2)}
.thema:first-child{border-top:0}
.thema input{margin-top:2px}
.thema span{flex:1;font-size:13.5px}
.thema small{display:block;color:var(--muted);font-size:11.5px}
.thema.done span{color:var(--muted);text-decoration:line-through}
details.done-list{margin-top:10px}
details.done-list summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 0}
.trow{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-top:1px solid var(--line-2);font-size:13.5px}
.trow:first-child{border-top:0}
.trow:hover{background:var(--surface-2)}
.trow b{font-weight:600;min-width:96px}

/* ---------- Einstellungen ---------- */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.set-serie{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;border-top:3px solid var(--c)}
.ss-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ss-head b{font-size:14.5px}
.ss-head .check{margin-left:auto;font-size:12.5px}
.ss-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap;font-size:12.5px}
.nths{display:flex;gap:5px;flex-wrap:wrap}
.nth{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;font-weight:650;background:#fff}
.nth.on{background:var(--accent);border-color:var(--accent);color:#fff}
.set-sec{margin-top:26px}
.set-sec>h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin-bottom:10px;font-weight:700}
.set-rows{padding:6px 18px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px;padding:12px 0;border-top:1px solid var(--line-2);align-items:center}
.set-row:first-child{border-top:0}
.set-row p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:#16212B;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:300;box-shadow:var(--shadow-lg);max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
.bottomnav{display:none}

/* ---------- Druck ---------- */
#printArea{display:none}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body{background:#fff}
}
.print-doc{font-family:var(--font);color:#000;font-size:11pt;line-height:1.45}
.print-doc .pb{font-size:9pt;text-transform:uppercase;letter-spacing:.12em;color:#555;border-bottom:1px solid #999;padding-bottom:6px;margin-bottom:14px}
.print-doc h1{font-family:var(--serif);font-size:20pt;margin:0 0 4px}
.print-doc h2{font-size:11pt;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
.print-doc .pre{white-space:pre-wrap}
.print-doc table{width:100%;border-collapse:collapse}
.print-doc td,.print-doc th{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left;font-size:10pt}
.print-doc .pf{margin-top:28px;font-size:8.5pt;color:#777}

/* ---------- Responsiv ---------- */
@media (max-width:1180px){
  .grid-3{grid-template-columns:1fr 1fr}
  .meta-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .meta-grid.proj{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{padding-left:0}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:276px;height:auto;z-index:90;transform:translateX(-100%);transition:transform .22s ease}
  body.drawer-open .sidebar{transform:none}
  body.drawer-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:85}
  .icon-btn.only-mobile{display:inline-grid}
  .topbar{padding:10px 12px;gap:8px}
  .topbar h1{font-size:16.5px}
  .saved{display:none}
  .search{width:auto;flex:1;min-width:0}
  .new-wrap .btn-lbl{display:none}
  .new-wrap .btn{padding:0 10px}
  .view{padding:18px 14px 110px}
  .kpis,.stat-row{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-ms,.grid-3{grid-template-columns:1fr}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0;font-weight:650;position:relative;text-align:center}
  .bn.active{color:var(--accent)}
  .bn .ic{width:22px;height:22px}
  .bn .nav-badge{position:absolute;top:0;left:calc(50% + 6px);font-size:10px;padding:0 5px;min-width:16px}
  .add-todo{grid-template-columns:1fr 1fr}
  .add-todo #tdText{grid-column:1/-1}
  #toast{bottom:84px}
  .m-body{padding:16px 14px 48px}
}
@media (max-width:640px){
  .greet{font-size:26px}
  .cal-head h2{font-size:21px;min-width:0}
  .legend{display:none}
  .cal-cell{min-height:56px;padding:3px}
  .cal-num small,.chip,.more{display:none}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;padding:0 3px}
  .cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
  .form-grid,.checks{grid-template-columns:1fr}
  .meta-grid,.meta-grid.proj{grid-template-columns:1fr 1fr}
  .hide-sm{display:none}
  .tn-list{grid-template-columns:1fr}
  .qbar{grid-template-columns:1fr 1fr}
  .set-row{grid-template-columns:1fr}
  .set-grid{grid-template-columns:1fr}
  .mcard{gap:12px;padding:10px 12px}
  .rel{display:none}
  .ag-day{grid-template-columns:1fr;gap:6px}
  .ag-date{display:flex;gap:8px;align-items:baseline}
  .modal.dialog{max-height:100%;border-radius:14px}
  .modal-backdrop.center{padding:10px}
  .partner-next{margin-left:0;text-align:left}
  .ms{flex-wrap:wrap}
  .m-head{padding:10px 8px 10px 12px;gap:6px}
  .m-head .pill{display:none}
  .m-actions .icon-btn{width:32px}
  .show-sm{display:block}
  .title-input,.m-title{font-size:20px}
  .table th,.table td{padding:9px 8px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">ZSM</div>
      <div><div class="brand-name">Organisation</div><div class="brand-sub">Primariat · Führungsebene</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" data-act="closeDrawer"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" data-act="openDrawer" aria-label="Menü"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="viewTitle">Übersicht</h1>
      <span class="saved" id="saved">✓ gespeichert</span>
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Suchen …" autocomplete="off" aria-label="Suchen">
        <div class="sr" id="searchResults"></div>
      </div>
      <div class="new-wrap" id="newWrap">
        <button class="btn primary" data-act="newMenu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="btn-lbl">Neu</span></button>
        <div class="new-menu" id="newMenu"></div>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>

/* Österreichische Feiertage (gesetzlich) + 24./31.12. als Hinweis */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return iso(new Date(y, mo-1, da)); }
const _hol = {};
function holidays(y){
  if(_hol[y]) return _hol[y];
  const H = {}, f = (md, n) => H[`${y}-${md}`] = n, e = easter(y);
  f('01-01','Neujahr'); f('01-06','Heilige Drei Könige'); f('05-01','Staatsfeiertag'); f('08-15','Mariä Himmelfahrt');
  f('10-26','Nationalfeiertag'); f('11-01','Allerheiligen'); f('12-08','Mariä Empfängnis'); f('12-24','Heiliger Abend');
  f('12-25','Christtag'); f('12-26','Stefanitag'); f('12-31','Silvester');
  H[e] = 'Ostersonntag'; H[addDays(e,1)] = 'Ostermontag'; H[addDays(e,39)] = 'Christi Himmelfahrt';
  H[addDays(e,49)] = 'Pfingstsonntag'; H[addDays(e,50)] = 'Pfingstmontag'; H[addDays(e,60)] = 'Fronleichnam';
  return _hol[y] = H;
}
const holiday = s => s ? (holidays(+s.slice(0,4))[s] || null) : null;
function nextWorkday(s){ let d = s; for(let i = 0; i < 14; i++){ const w = parse(d).getDay(); if(w !== 0 && w !== 6 && !holiday(d)) return d; d = addDays(d, 1); } return d; }
function nthWeekday(y, m, wd, nth){
  if(nth === -1){ const last = new Date(y, m+1, 0); last.setDate(last.getDate() - ((last.getDay() - wd + 7) % 7)); return iso(last); }
  const first = new Date(y, m, 1); const day = 1 + ((wd - first.getDay() + 7) % 7) + (nth-1)*7; const d = new Date(y, m, day);
  return d.getMonth() === m ? iso(d) : null;
}
function ruleText(r){

  const n = r.nths.slice().sort((a,b)=>(a===-1?9:a)-(b===-1?9:b)).map(x => x === -1 ? 'letzten' : x + '.');
  const list = n.length > 1 ? n.slice(0,-1).join(', ') + ' und ' + n[n.length-1] : n[0];
  return `Jeden ${list} ${WD_LONG[r.wd]} im Monat · ${r.zeit} Uhr${r.ort ? ' · ' + r.ort : ''}`;
}

/* Serientermine erzeugen (Ärzte-, Stationsleiterbesprechung, Fortbildung) */
function genSeries(fromISO, months, minDate, onlyKat){
  const S = DB.settings.serien; let created = 0; const start = parse(fromISO);
  Object.keys(S).forEach(kat => {
    const r = S[kat]; if(!r.aktiv || (onlyKat && kat !== onlyKat)) return;
    for(let i = 0; i < months; i++){
      const d0 = new Date(start.getFullYear(), start.getMonth() + i, 1), yy = d0.getFullYear(), mm = d0.getMonth();
      r.nths.forEach(n => {
        const date = nthWeekday(yy, mm, Number(r.wd), n); if(!date || (minDate && date < minDate)) return;
        const key = `${kat}:${yy}-${pad(mm+1)}:${n}`;
        if(DB.meta.skip.includes(key) || DB.termine.some(t => t.serieKey === key)) return;
        DB.termine.push(newTermin(kat, {datum:date, zeit:r.zeit, dauer:Number(r.dauer)||60, ort:r.ort, serieKey:key}));
        created++;
      });
    }
  });
  return created;
}
/* Teilnehmerlisten zukünftiger Serientermine mit Personenliste abgleichen */
function syncSeriesTeilnehmer(p){
  const t0 = todayISO();
  DB.termine.filter(t => t.serieKey && t.status === 'geplant' && t.datum >= t0).forEach(t => {
    const g = (t.kat === 'aerzte' || t.kat === 'fortbildung') ? 'arzt' : t.kat === 'stationsleiter' ? 'stationsleitung' : null;
    if(!g) return;
    const should = p.aktiv && p.gruppe === g, has = t.teilnehmer.some(x => x.pid === p.id);
    if(should && !has) t.teilnehmer.push({pid:p.id, st:'offen'});
    if(!should && has) t.teilnehmer = t.teilnehmer.filter(x => x.pid !== p.id);
  });
}

/* ---------- 5  Logik ---------- */
function magInfo(p){
  const S = DB.settings, t = todayISO(), y = t.slice(0,4);
  const due = p.letzteMAG ? addMonths(p.letzteMAG, Number(S.magIntervall)||12) : (p.eintritt ? addMonths(p.eintritt, Number(S.magErst)||6) : t);
  const planned = DB.termine.filter(x => x.kat === 'mag' && x.pid === p.id && x.status === 'geplant' && x.datum >= t).sort(byDT)[0] || null;
  let st;
  if(planned) st = 'vereinbart';
  else if(p.letzteMAG && p.letzteMAG.startsWith(y) && due > t) st = 'erledigt';
  else if(due < t) st = 'ueberfaellig';
  else if(diffDays(t, due) <= Number(S.vorlauf.mag)) st = 'faellig';
  else st = 'ok';
  return {due, planned, st};
}
function fbCheck(t){
  const items = FB_CHECK.filter(c => !c[2] || c[2] === t.fb.refTyp);
  const done = items.filter(c => t.fb.check[c[0]]);
  return {items, total:items.length, done:done.length, open:items.filter(c => !t.fb.check[c[0]]).map(c => c[1])};
}
function agenda(from, to){
  const out = [];
  DB.termine.forEach(t => {
    if(t.datum < from || t.datum > to) return;
    let warn = '';
    if(t.status === 'geplant' && holiday(t.datum)) warn = holiday(t.datum);
    if(t.kat === 'fortbildung' && t.status === 'geplant' && !t.fb.thema) warn = 'Thema offen';
    out.push({kind:'termin', datum:t.datum, zeit:t.zeit, kat:t.kat, title:titleOf(t), sub:subOf(t), act:'openTermin', id:t.id, status:t.status, warn});
  });
  DB.projekte.forEach(p => {
    if(p.status === 'abgeschlossen') return;
    p.meilensteine.forEach(m => { if(m.datum && m.datum >= from && m.datum <= to) out.push({kind:'meilenstein', datum:m.datum, zeit:'', kat:'projekt', title:m.titel, sub:p.name, act:'openProjekt', id:p.id, status:m.erledigt ? 'erledigt' : 'geplant', warn:''}); });
    if(p.wiedervorlage && p.wiedervorlage >= from && p.wiedervorlage <= to) out.push({kind:'wv', datum:p.wiedervorlage, zeit:'', kat:'projekt', title:'Wiedervorlage: ' + p.name, sub:'', act:'openProjekt', id:p.id, status:'geplant', warn:''});
  });
  return out.sort((a, b) => (a.datum + (a.zeit || '99')).localeCompare(b.datum + (b.zeit || '99')));
}
/* Handlungsbedarf & Erinnerungen – Herzstück der Übersicht */
function issues(){
  const out = [], t = todayISO(), V = DB.settings.vorlauf;
  DB.todos.filter(x => !x.erledigt && x.frist && x.frist < t).sort((a,b) => a.frist.localeCompare(b.frist))
    .forEach(x => out.push({sev:'high', icon:'aufgaben', text:'Aufgabe überfällig: ' + x.text, sub:`${pshort(P(x.pid))} · fällig seit ${fmtD(x.frist)}`, act:'openTodo', id:x.id}));
  activeGroup('arzt').forEach(p => { const m = magInfo(p);
    if(m.st === 'ueberfaellig') out.push({sev:'high', icon:'mag', text:'Mitarbeitergespräch überfällig: ' + pname(p), sub:`fällig seit ${fmtD(m.due)} – noch kein Termin vereinbart`, act:'newMag', id:p.id});
    else if(m.st === 'faellig') out.push({sev:'mid', icon:'mag', text:'Mitarbeitergespräch fällig: ' + pname(p), sub:`fällig ab ${fmtD(m.due)} – Termin vereinbaren`, act:'newMag', id:p.id}); });
  DB.termine.filter(x => x.kat === 'fortbildung' && x.status === 'geplant' && x.datum >= t && diffDays(t, x.datum) <= Number(V.fortbildung)).sort(byDT).forEach(x => {
    const f = x.fb, hasRef = f.refTyp === 'intern' ? !!f.refPid : !!f.refName;
    if(!f.thema || !hasRef) out.push({sev:'high', icon:'fortbildung', text:`Fortbildung ${fmtDW(x.datum)}: ${!f.thema && !hasRef ? 'Thema und Referent:in fehlen' : !f.thema ? 'Thema fehlt' : 'Referent:in fehlt'}`, sub:relDays(x.datum), act:'openTermin', id:x.id});
    else { const c = fbCheck(x); if(c.done < c.total) out.push({sev:'mid', icon:'fortbildung', text:`Fortbildung „${f.thema}“: Organisation ${c.done}/${c.total}`, sub:'Offen: ' + c.open.join(', '), act:'openTermin', id:x.id}); }
  });
  const q = quarterOf(t);
  activeGroup('jourfixe').forEach(p => {
    const has = DB.termine.some(x => x.kat === 'jourfixe' && x.partnerId === p.id && x.status !== 'abgesagt' && quarterOf(x.datum) === q);
    if(!has) out.push({sev:'mid', icon:'jourfixe', text:`Jour fixe mit ${pshort(p)} für ${qLabel(q)} noch nicht geplant`, sub:'Einmal pro Quartal vorgesehen', act:'newJF', id:p.id});
  });
  DB.projekte.filter(p => p.status !== 'abgeschlossen').forEach(p => {
    p.meilensteine.filter(m => !m.erledigt && m.datum).forEach(m => { const d = diffDays(t, m.datum);
      if(d < 0) out.push({sev:'high', icon:'flag', text:'Meilenstein überfällig: ' + m.titel, sub:`${p.name} · seit ${fmtD(m.datum)}`, act:'openProjekt', id:p.id});
      else if(d <= Number(V.projekt)) out.push({sev:'info', icon:'flag', text:`Meilenstein ${relDays(m.datum)}: ${m.titel}`, sub:p.name, act:'openProjekt', id:p.id}); });
    if(p.wiedervorlage && p.wiedervorlage <= t) out.push({sev:'mid', icon:'bell', text:'Wiedervorlage: ' + p.name, sub:`fällig seit ${fmtD(p.wiedervorlage)}`, act:'openProjekt', id:p.id});
    if(p.ampel === 'rot') out.push({sev:'mid', icon:'projekte', text:'Projekt kritisch: ' + p.name, sub:`Ampel rot · ${p.fortschritt}% · verantwortlich ${pshort(P(p.pid))}`, act:'openProjekt', id:p.id});
  });
  DB.termine.filter(x => x.status === 'geplant' && x.datum < t && diffDays(x.datum, t) <= 60).sort(byDT)
    .forEach(x => out.push({sev:'mid', icon:'edit', text:`Nachtragen: ${titleOf(x)} vom ${fmtD(x.datum)}`, sub:'Status, Anwesenheit und Protokoll ergänzen', act:'openTermin', id:x.id}));
  DB.termine.filter(x => x.status === 'geplant' && x.datum >= t && diffDays(t, x.datum) <= 120 && holiday(x.datum)).sort(byDT)
    .forEach(x => out.push({sev:'mid', icon:'calendar', text:`${titleOf(x)} fällt auf ${holiday(x.datum)}`, sub:fmtLong(x.datum) + ' – verschieben oder absagen', act:'openTermin', id:x.id}));
  DB.termine.filter(x => x.status === 'geplant' && x.datum >= t).sort(byDT).forEach(x => {
    const d = diffDays(t, x.datum);
    if((x.kat === 'aerzte' || x.kat === 'stationsleiter') && d <= Number(V[x.kat])) out.push({sev:'info', icon:'bell', text:`${KAT[x.kat].label} ${relDays(x.datum)}`, sub:`${x.zeit} Uhr · ${x.tops.length} Tagesordnungspunkte`, act:'openTermin', id:x.id});
    if(x.kat === 'jourfixe' && d <= Number(V.jourfixe)){ const n = DB.themen.filter(y => y.partnerId === x.partnerId && !y.erledigt).length;
      out.push({sev:'info', icon:'bell', text:`${titleOf(x)} ${relDays(x.datum)}`, sub: n ? `${n} offene Themen im Themenspeicher – Tagesordnung vorbereiten` : 'Themenspeicher ist leer', act:'openTermin', id:x.id}); }
    if(x.kat === 'mag' && d <= 7) out.push({sev:'info', icon:'bell', text:`${titleOf(x)} ${relDays(x.datum)}`, sub:'Ziele aus dem letzten Gespräch ansehen', act:'openTermin', id:x.id});
  });
  return out.map((x, i) => Object.assign(x, {i})).sort((a, b) => SEV[a.sev] - SEV[b.sev] || a.i - b.i);
}

/* --- gemeinsame Bausteine --- */

}
function agendaHTML(items){

function issueHTML(x){ return `<button class="issue ${x.sev}" data-act="${x.act}" data-id="${x.id}">${icon(x.sev === 'info' ? 'bell' : x.sev === 'high' ? 'alert' : x.icon)}<span><b>${esc(x.text)}</b><small>${esc(x.sub)}</small></span></button>`; }

function todoRow(x, o={}){

  }

const todoSort = (a, b) => (a.erledigt - b.erledigt) || (a.frist || '9999').localeCompare(b.frist || '9999');
const tabsHTML = (key, opts) => `<div class="tabs">${opts.map(([v, l, n]) => `<button class="tab ${VS[key] === v ? 'on' : ''}" data-act="setF" data-k="${key}" data-v="${v}">${l}${n != null ? `<span class="count">${n}</span>` : ''}</button>`).join('')}</div>`;

/* --- Übersicht --- */
function vUebersicht(){
  const t = todayISO(), y = t.slice(0,4), S = DB.settings, hr = new Date().getHours();
  const gruss = hr < 11 ? 'Guten Morgen' : hr < 18 ? 'Guten Tag' : 'Guten Abend';
  const sunday = addDays(t, 6 - ((parse(t).getDay() + 6) % 7));
  const week = agenda(t, sunday).filter(a => a.kind === 'termin' && a.status !== 'abgesagt');
  const todayN = agenda(t, t).filter(a => a.status !== 'abgesagt').length;
  const open = DB.todos.filter(x => !x.erledigt), overdue = open.filter(x => x.frist && x.frist < t);
  const aerzte = activeGroup('arzt'), magDone = aerzte.filter(p => (p.letzteMAG || '').startsWith(y)).length;
  const proj = DB.projekte.filter(p => p.status !== 'abgeschlossen'), krit = proj.filter(p => p.ampel === 'rot').length;
  const iss = issues(), relevant = iss.filter(i => i.sev !== 'info').length;
  const parts = [todayN ? `Heute ${todayN === 1 ? 'steht 1 Termin' : 'stehen ' + todayN + ' Termine'} an` : 'Heute keine Termine'];
  if(overdue.length) parts.push(`${overdue.length} ${overdue.length === 1 ? 'Aufgabe ist' : 'Aufgaben sind'} überfällig`);

  <div class="kpis">
    <button class="kpi" data-act="go" data-route="kalender"><span class="kpi-label">Diese Woche</span><span class="kpi-val">${week.length}</span><span class="kpi-sub">Termine bis Sonntag</span></button>
    <button class="kpi" data-act="go" data-route="aufgaben"><span class="kpi-label">Offene Aufgaben</span><span class="kpi-val">${open.length}</span><span class="kpi-sub ${overdue.length ? 'bad' : ''}">${overdue.length ? overdue.length + ' überfällig' : 'nichts überfällig'}</span></button>
    <button class="kpi" data-act="go" data-route="mag"><span class="kpi-label">Mitarbeitergespräche ${y}</span><span class="kpi-val">${magDone}<small> / ${aerzte.length}</small></span><div class="bar"><span style="width:${aerzte.length ? Math.round(magDone / aerzte.length * 100) : 0}%"></span></div></button>

    <section class="card"><header class="card-h"><h3>${icon('alert')}Handlungsbedarf & Erinnerungen</h3><span class="pill ${relevant ? 'red' : 'green'}">${relevant || '✓'}</span></header>
      <div class="card-b">${iss.length ? `<div class="issues">${shown.map(issueHTML).join('')}</div>${iss.length > 9 ? `<button class="more-btn" data-act="toggleIssues">${VS.allIssues ? 'Weniger anzeigen' : `Alle ${iss.length} anzeigen`}</button>` : ''}` : '<div class="empty">Alles erledigt – kein Handlungsbedarf.</div>'}</div></section>

/* --- Kalender --- */
function vKalender(){
  const {y, m, sel} = VS.cal, t = todayISO();
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, dim = new Date(y, m+1, 0).getDate();
  const cells = Math.ceil((off + dim) / 7) * 7, start = iso(new Date(y, m, 1 - off)), end = addDays(start, cells - 1);
  const by = groupBy(agenda(start, end), a => a.datum);
  let grid = '';
  for(let i = 0; i < cells; i++){
    const d = addDays(start, i), dt = parse(d), items = by[d] || [], h = holiday(d), wd = dt.getDay();
    const cls = [dt.getMonth() !== m && 'out', d === t && 'today', d === sel && 'sel', (wd === 0 || wd === 6) && 'we', h && 'hol'].filter(Boolean).join(' ');
    grid += `<div class="cal-cell ${cls}" data-act="calDay" data-date="${d}"><div class="cal-num"><b>${dt.getDate()}</b>${h ? `<small title="${esc(h)}">${esc(h)}</small>` : ''}</div>
      ${items.slice(0, 3).map(a => `<button class="chip ${a.status}" data-act="${a.act}" data-id="${a.id}" style="${katStyle(a.kat)}" title="${esc(a.title)}">${a.zeit ? `<b>${a.zeit}</b>` : ''}${esc(a.title)}</button>`).join('')}
      ${items.length > 3 ? `<span class="more">+${items.length - 3} weitere</span>` : ''}
      ${items.length ? `<div class="cal-dots">${items.slice(0, 5).map(a => `<i style="--c:${KAT[a.kat].color}"></i>`).join('')}</div>` : ''}</div>`;
  }
  const dayItems = agenda(sel, sel);
  return `<div class="cal-head"><button class="icon-btn" data-act="calMove" data-n="-1" title="Vorheriger Monat">${icon('left')}</button><button class="icon-btn" data-act="calMove" data-n="1" title="Nächster Monat">${icon('right')}</button><h2>${MON[m]} ${y}</h2><button class="btn sm" data-act="calToday">Heute</button>
    <div class="legend">${['aerzte','stationsleiter','jourfixe','fortbildung','mag','projekt'].map(k => `<span><i style="--c:${KAT[k].color}"></i>${KAT[k].short}</span>`).join('')}</div></div>
  <div class="grid-ms"><div class="cal"><div class="cal-wd">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div>${d}</div>`).join('')}</div><div class="cal-grid">${grid}</div></div>
    <aside class="card"><header class="card-h"><h3>${fmtLong(sel)}</h3><button class="btn sm" data-act="newTermin" data-date="${sel}">${icon('plus')}Termin</button></header>
      <div class="card-b">${holiday(sel) ? `<div class="warn" style="margin:0 0 10px">${icon('alert')}${esc(holiday(sel))}</div>` : ''}${dayItems.length ? `<div class="ag-items">${dayItems.map(agItem).join('')}</div>` : '<div class="empty">Keine Termine an diesem Tag.</div>'}</div></aside></div>`;
}

/* --- Ärzte- / Stationsleiterbesprechung --- */

/* --- Jour fixe --- */

  const p = partners.find(x => x.id === VS.jf) || partners[0];
  const ts = DB.termine.filter(x => x.kat === 'jourfixe' && x.partnerId === p.id);

      ${p.wiedervorlage ? `<div class="pc-wv">${icon('bell')}Wiedervorlage ${fmtD(p.wiedervorlage)} (${relDays(p.wiedervorlage)})</div>` : ''}</button>`; };

    ${list.length ? `<div class="pgrid">${list.map(card).join('')}</div>` : '<div class="card"><div class="empty">Keine Projekte in dieser Ansicht.</div></div>'}
    ${list.length ? timelineHTML(list.slice().sort((a, b) => (a.start || a.erstellt || '').localeCompare(b.start || b.erstellt || ''))) : ''}`;
}

/* --- Zeitleiste (ein Balken pro Projekt) --- */
function tlAlign(span, ref){ const d = parse(ref); return iso(new Date(d.getFullYear(), Math.floor(d.getMonth() / span) * span, 1)); }
function tlLabel(start, span){ const d = parse(start), y = d.getFullYear(); if(span === 12) return String(y); if(span === 6) return `${d.getMonth() < 6 ? 1 : 2}. Halbjahr ${y}`; return `Q${Math.floor(d.getMonth() / 3) + 1} ${y}`; }
function timelineHTML(projects){
  const span = VS.tlSpan, t = todayISO();
  if(!VS.tlStart) VS.tlStart = tlAlign(span, t);
  const start = VS.tlStart, endEx = addMonths(start, span), total = diffDays(start, endEx);
  const pos = d => diffDays(start, d) / total * 100, clamp = v => Math.max(0, Math.min(100, v)), half = 0.5 / total * 100;
  let head = '', lines = '';
  for(let i = 0; i < span; i++){
    const ms = addMonths(start, i), l = pos(ms), w = pos(addMonths(start, i + 1)) - l, d = parse(ms);
    head += `<div class="tl-mon" style="left:${l}%;width:${w}%">${span === 12 ? MON_S[d.getMonth()] : MON[d.getMonth()]}${span !== 12 && (i === 0 || d.getMonth() === 0) ? `<small>${d.getFullYear()}</small>` : ''}</div>`;
    if(i > 0) lines += `<div class="tl-line" style="left:${l}%"></div>`;
  }
  const today = t >= start && t < endEx ? `<div class="tl-today" style="left:${pos(t) + half}%"><span>heute</span></div>` : '';
  const rows = projects.map(p => {
    const s = p.start || p.erstellt || t, msd = p.meilensteine.map(m => m.datum).filter(Boolean).sort();
    let e = p.ende || msd[msd.length - 1] || addDays(s, 30); if(e < s) e = s;
    const eEx = addDays(e, 1), name = esc(p.name || 'Ohne Namen');
    const tip = `${p.name || 'Projekt'} · ${fmtD(s)} – ${p.ende ? fmtD(p.ende) : 'offen'} · ${p.fortschritt} % · ${pshort(P(p.pid))}`;
    if(eEx <= start) return `<div class="tl-row"><button class="tl-off" style="left:4px" data-act="openProjekt" data-id="${p.id}" title="${esc(tip)}">← ${name} · endete ${fmtD(e)}</button></div>`;
    if(s >= endEx) return `<div class="tl-row"><button class="tl-off" style="right:4px" data-act="openProjekt" data-id="${p.id}" title="${esc(tip)}">${name} · beginnt ${fmtD(s)} →</button></div>`;
    const fL = pos(s), fR = pos(eEx), L = clamp(fL), R = clamp(fR), W = R - L;
    const pe = clamp(fL + (fR - fL) * (Number(p.fortschritt) || 0) / 100), progW = W > 0 ? Math.max(0, (pe - L) / W * 100) : 0;
    const cls = ['tl-bar', 'b-' + p.ampel, fL < 0 && 'cl', fR > 100 && 'cr', !p.ende && 'open', p.status === 'pausiert' && 'pausiert'].filter(Boolean).join(' ');
    const narrow = W < 15;
    const out = narrow ? (R < 70 ? `<span class="tl-out" style="left:calc(${R}% + 8px)">${name}</span>` : `<span class="tl-out" style="right:calc(${100 - L}% + 8px)">${name}</span>`) : '';
    const ms = p.meilensteine.filter(m => m.datum && m.datum >= start && m.datum < endEx).map(m => {
      const st = m.erledigt ? 'done' : m.datum < t ? 'over' : 'offen';
      return `<button class="tl-ms ${st}" style="left:${pos(m.datum) + half}%" data-act="openProjekt" data-id="${p.id}" title="Meilenstein: ${esc(m.titel)} · ${fmtD(m.datum)}${m.erledigt ? ' · erreicht' : st === 'over' ? ' · überfällig' : ''}"></button>`; }).join('');
    return `<div class="tl-row"><button class="${cls}" style="left:${L}%;width:${W}%" data-act="openProjekt" data-id="${p.id}" title="${esc(tip)}"><span class="tl-prog" style="width:${progW}%"></span>${narrow ? '' : `<span class="tl-lbl">${name}<small>${p.fortschritt} %</small></span>`}</button>${out}${ms}</div>`;
  }).join('');
  return `<section class="card tl-card"><header class="card-h"><h3>${icon('calendar')}Zeitleiste<span class="tl-period">${tlLabel(start, span)}</span></h3>
    <div class="actions"><button class="icon-btn sm" data-act="tlMove" data-n="-1" title="Zurück">${icon('left')}</button><button class="btn sm" data-act="tlToday">Heute</button><button class="icon-btn sm" data-act="tlMove" data-n="1" title="Weiter">${icon('right')}</button>
      <div class="tabs">${[[3,'Quartal'],[6,'Halbjahr'],[12,'Jahr']].map(([v, l]) => `<button class="tab ${span === v ? 'on' : ''}" data-act="tlSpan" data-v="${v}">${l}</button>`).join('')}</div></div></header>
    <div class="tl-scroll"><div class="tlc" style="min-width:${span === 12 ? 900 : span === 6 ? 640 : 480}px"><div class="tl-head">${head}</div><div class="tl-body">${lines}${today}${rows}</div></div></div>
    <div class="tl-legend"><span><i class="b b-gruen"></i>im Plan</span><span><i class="b b-gelb"></i>Achtung</span><span><i class="b b-rot"></i>kritisch</span><span>dunkler Teil = Fortschritt</span>
      <span><i class="d" style="background:var(--green)"></i>Meilenstein erreicht</span><span><i class="d" style="background:#D9A21B"></i>offen</span><span><i class="d" style="background:var(--red)"></i>überfällig</span><span>gestrichelter Rand = läuft weiter / ohne Ende</span></div></section>`;
}

/* --- Fortbildungen --- */
function refHTML(x){
  const f = x.fb;
  if(f.refTyp === 'intern') return f.refPid ? `<span class="pill green">intern</span> ${esc(pshort(P(f.refPid)))}` : '<span class="muted">Referent:in offen</span>';
  return f.refName ? `<span class="pill blue">extern</span> ${esc(f.refName)}${f.refInst ? `<small class="block muted">${esc(f.refInst)}</small>` : ''}` : '<span class="muted">Referent:in offen</span>';
}
function vFortbildungen(){
  const t = todayISO(), Y = VS.fbYear || t.slice(0,4), r = DB.settings.serien.fortbildung;
  const list = DB.termine.filter(x => x.kat === 'fortbildung' && x.datum.startsWith(Y)).sort(byDT), act = list.filter(x => x.status !== 'abgesagt');
  const ext = act.filter(x => x.fb.refTyp === 'extern' && x.fb.refName).length, int = act.filter(x => x.fb.refTyp === 'intern' && x.fb.refPid).length;
  const dfp = act.reduce((s, x) => s + (Number(x.fb.dfp) || 0), 0), offen = act.filter(x => !x.fb.thema).length;
  const yrs = [+t.slice(0,4) - 1, +t.slice(0,4), +t.slice(0,4) + 1].map(String);
  const rows = list.map(x => { const c = fbCheck(x);
    return `<tr class="click ${x.status}" data-act="openTermin" data-id="${x.id}"><td style="white-space:nowrap"><b>${fmtDW(x.datum)}</b><small class="block muted">${x.zeit} Uhr</small></td><td>${x.fb.thema ? esc(x.fb.thema) : '<span class="pill amber">Thema offen</span>'}</td><td>${refHTML(x)}</td><td class="num hide-sm">${x.fb.dfp || '–'}</td><td class="hide-sm"><span class="dots" title="${c.done} von ${c.total} erledigt">${c.items.map(i => `<i class="${x.fb.check[i[0]] ? 'on' : ''}"></i>`).join('')}</span></td><td>${statusPill(x)}</td></tr>`; }).join('');
  const last = {};
  DB.termine.filter(x => x.kat === 'fortbildung' && x.fb.refTyp === 'intern' && x.fb.refPid && x.status !== 'abgesagt').forEach(x => { if(!last[x.fb.refPid] || x.datum > last[x.fb.refPid]) last[x.fb.refPid] = x.datum; });
  const rot = activeGroup('arzt').map(p => ({p, d:last[p.id] || ''})).sort((a, b) => a.d.localeCompare(b.d));
  return `<div class="page-head"><p class="rule">${icon('repeat')}${r.aktiv ? esc(ruleText(r)) : 'Automatische Serie ist deaktiviert'}</p><div class="actions"><div class="tabs">${yrs.map(v => `<button class="tab ${Y === v ? 'on' : ''}" data-act="setF" data-k="fbYear" data-v="${v}">${v}</button>`).join('')}</div><button class="btn primary" data-act="newTermin" data-kat="fortbildung">${icon('plus')}Zusatzfortbildung</button></div></div>
  <div class="stat-row"><div class="stat"><b>${act.length}</b><span>Fortbildungen ${Y}</span></div><div class="stat"><b>${int} / ${ext}</b><span>intern / extern besetzt</span></div><div class="stat"><b>${dfp}</b><span>DFP-Punkte gesamt</span></div><div class="stat"><b style="color:${offen ? 'var(--amber)' : 'inherit'}">${offen}</b><span>noch ohne Thema</span></div></div>
  <div class="grid-ms"><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Datum</th><th>Thema</th><th>Referent:in</th><th class="num hide-sm">DFP</th><th class="hide-sm">Organisation</th><th>Status</th></tr></thead><tbody>${rows || '<tr><td colspan="6"><div class="empty">Keine Fortbildungen in diesem Jahr.</div></td></tr>'}</tbody></table></div></section>
  <aside class="card"><header class="card-h"><h3>Referentenrotation</h3></header><div class="card-b"><p class="muted small" style="margin:0 0 8px">Wer aus dem Team war am längsten nicht als Referent:in dran?</p><div class="rot-list">${rot.map(x => `<div class="rot"><span class="avatar xs">${initials(x.p)}</span><span class="grow">${esc(pshort(x.p))}</span><small>${x.d ? (x.d >= t ? 'geplant ' + fmtD(x.d) : 'zuletzt ' + fmtD(x.d)) : 'noch nie'}</small></div>`).join('')}</div></div></aside></div>`;
}

/* --- Mitarbeitergespräche --- */
function vMag(){
  const t = todayISO(), y = t.slice(0,4), f = VS.magF;
  const rows = activeGroup('arzt').map(p => Object.assign({p}, magInfo(p)));
  const done = rows.filter(r => (r.p.letzteMAG || '').startsWith(y)).length, cnt = {};
  rows.forEach(r => cnt[r.st] = (cnt[r.st] || 0) + 1);
  const shown = rows.filter(r => f === 'alle' || r.st === f).sort((a, b) => MAG_ST[a.st].o - MAG_ST[b.st].o || a.due.localeCompare(b.due));
  const pct = rows.length ? Math.round(done / rows.length * 100) : 0;
  const tr = r => { const p = r.p, s = MAG_ST[r.st];
    return `<tr><td><div class="who"><span class="avatar">${initials(p)}</span><div><b>${esc(pname(p))}</b><small>${esc(p.funktion)}</small></div></div></td>
      <td class="hide-sm">${p.letzteMAG ? fmtD(p.letzteMAG) : '<span class="muted">noch keines</span>'}</td>
      <td class="hide-sm">${fmtD(r.due)}<small class="block muted">${p.letzteMAG ? relDays(r.due) : 'Erstgespräch · ' + relDays(r.due)}</small></td>
      <td><span class="pill ${s.c}">${s.l}</span><small class="show-sm muted">fällig ab ${fmtD(r.due)}</small>${r.planned ? `<small class="block muted">${fmtDW(r.planned.datum)} · ${r.planned.zeit} Uhr</small>` : ''}</td>
      <td><div class="actions">${r.planned ? `<button class="btn sm" data-act="openTermin" data-id="${r.planned.id}">Öffnen</button>` : `<button class="btn sm ${r.st === 'ueberfaellig' || r.st === 'faellig' ? 'primary' : ''}" data-act="newMag" data-id="${p.id}">Termin<span class="hide-sm">&nbsp;anlegen</span></button>`}<button class="icon-btn sm" data-act="magHistory" data-id="${p.id}" title="Bisherige Gespräche">${icon('clock')}</button></div></td></tr>`; };
  return `<section class="card" style="margin-bottom:18px"><div class="card-b" style="padding-top:18px"><div class="page-head" style="margin:0"><div><div class="eyebrow">Jahresziel ${y}</div><h2 class="greet" style="font-size:28px">${done} von ${rows.length} Gesprächen geführt</h2></div><span class="muted">Intervall: alle ${DB.settings.magIntervall} Monate · Erstgespräch nach ${DB.settings.magErst} Monaten</span></div><div class="bar lg"><span style="width:${pct}%"></span></div></div></section>
  <div class="page-head">${tabsHTML('magF', [['alle','Alle',rows.length],['ueberfaellig','Überfällig',cnt.ueberfaellig||0],['faellig','Fällig',cnt.faellig||0],['vereinbart','Vereinbart',cnt.vereinbart||0],['erledigt','Geführt',cnt.erledigt||0],['ok','Nicht fällig',cnt.ok||0]])}</div>
  <section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Arzt / Ärztin</th><th class="hide-sm">Letztes Gespräch</th><th class="hide-sm">Fällig ab</th><th>Status</th><th></th></tr></thead><tbody>${shown.map(tr).join('') || '<tr><td colspan="5"><div class="empty">Niemand in dieser Kategorie.</div></td></tr>'}</tbody></table></div></section>`;
}

/* --- Aufgaben --- */

  const t = todayISO(), f = VS.todoF;
  let list = DB.todos.slice(); if(VS.todoPid) list = list.filter(x => x.pid === VS.todoPid);
  const c = {offen:list.filter(x => !x.erledigt).length, ueberfaellig:list.filter(x => !x.erledigt && x.frist && x.frist < t).length, erledigt:list.filter(x => x.erledigt).length, alle:list.length};
  if(f === 'offen') list = list.filter(x => !x.erledigt); else if(f === 'ueberfaellig') list = list.filter(x => !x.erledigt && x.frist && x.frist < t); else if(f === 'erledigt') list = list.filter(x => x.erledigt);
  list.sort(f === 'erledigt' ? (a, b) => (b.erledigtAm || '').localeCompare(a.erledigtAm || '') : todoSort);

    <div class="set-row"><div><b>Demo-Daten neu laden</b><p>Setzt die App auf die fiktiven Beispieldaten zurück.</p></div><button class="btn" data-act="resetDemo">Zurücksetzen</button></div>
    <div class="set-row"><div><b>Leer starten</b><p>Löscht alle Daten – für den echten Einsatz.</p></div><button class="btn danger" data-act="wipeAll">Alles löschen</button></div></section></div>

/* ---------- 7  Detailfenster ---------- */
const DIALOGS = ['todo','person','neuTermin','magVerlauf'];
function openModal(type, id, extra={}, replace=false){
  const prev = MODAL;
  MODAL = Object.assign({type, id}, extra, {back: replace ? (prev && prev.back) : prev});
  closeMenus(); renderModal();
}
function renderModal(){
  const root = $('#modalRoot');
  if(!MODAL){ root.innerHTML = ''; document.body.classList.remove('modal-open'); return; }
  const fn = {termin:mTermin, projekt:mProjekt, person:mPerson, todo:mTodo, neuTermin:mNeuTermin, magVerlauf:mMagVerlauf}[MODAL.type];
  const html = fn(MODAL);
  if(html === null){ MODAL = MODAL.back || null; return renderModal(); }
  const old = root.querySelector('.m-body'), scroll = old && old.dataset.m === MODAL.type + MODAL.id ? old.scrollTop : 0;
  const dlg = DIALOGS.includes(MODAL.type);
  root.innerHTML = `<div class="modal-backdrop ${dlg ? 'center' : ''}"><div class="modal ${dlg ? 'dialog' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('modal-open');
  const body = root.querySelector('.m-body'); if(body){ body.dataset.m = MODAL.type + MODAL.id; body.scrollTop = scroll; }
  if(MODAL.focus){ const el = root.querySelector(MODAL.focus); if(el) el.focus(); MODAL.focus = null; }
}
function closeModal(){
  const M = MODAL; if(!M) return;
  if(M.type === 'projekt' && M.isNew){ const p = PR(M.id); if(p && !p.name.trim() && !p.ziel.trim() && !p.meilensteine.length){ DB.projekte = DB.projekte.filter(x => x.id !== p.id); save(); } }
  MODAL = M.back || null; renderModal(); render();
}
const mHead = (title, kat) => `<div class="m-head" ${kat ? `style="${katStyle(kat)}"` : ''}><h3>${title}</h3><div class="m-actions"><button class="icon-btn" data-act="closeModal" title="Schließen (Esc)">${icon('x')}</button></div></div>`;
function dateWarn(d){
  if(!d) return '';
  const h = holiday(d), w = parse(d).getDay();
  if(h) return `<div class="warn">${icon('alert')}${esc(h)} – Termin bitte verschieben oder absagen.</div>`;
  if(w === 0 || w === 6) return `<div class="warn">${icon('alert')}Der Termin liegt auf einem Wochenende.</div>`;
  return '';
}

function mTermin(M){
  const t = T(M.id); if(!t) return null;
  const k = KAT[t.kat], B = f => `termine.${t.id}.${f}`;
  let head;
  if(['aerzte','stationsleiter','sonstig'].includes(t.kat)) head = `<input class="title-input" data-bind="${B('titel')}" value="${esc(t.titel)}" placeholder="Titel">`;
  else if(t.kat === 'fortbildung') head = `<input class="title-input" data-bind="${B('fb.thema')}" value="${esc(t.fb.thema)}" placeholder="Thema der Fortbildung eingeben …">`;
  else head = `<div class="m-title">${esc(titleOf(t))}</div>`;
  let s = '';
  if(t.kat === 'mag') s += secMag(t);
  if(t.kat === 'fortbildung') s += secFortbildung(t);
  if(t.kat === 'jourfixe') s += secThemen(t);
  if(['aerzte','stationsleiter','sonstig','jourfixe'].includes(t.kat)) s += secTops(t);
  if(['aerzte','stationsleiter','fortbildung','sonstig'].includes(t.kat)) s += secTeilnehmer(t);
  s += `<section class="m-sec"><div class="sec-h"><h4>${t.kat === 'mag' ? 'Interne Notizen' : t.kat === 'fortbildung' ? 'Notizen' : 'Protokoll'}</h4></div><textarea class="in" rows="6" data-bind="${B('protokoll')}" placeholder="${t.kat === 'mag' ? 'Notizen zum Gespräch …' : 'Ergebnisse, Beschlüsse, Notizen …'}">${esc(t.protokoll)}</textarea></section>`;
  s += secTodos({typ:'termin', id:t.id});
  return `<div class="m-head" style="${katStyle(t.kat)}"><span class="kat-badge">${icon(k.icon)}${esc(k.label)}</span>${t.serieKey ? `<span class="pill" title="Automatisch aus der Terminserie erzeugt">${icon('repeat','sm')}Serie</span>` : ''}
    <div class="m-actions"><button class="icon-btn" data-act="icsTermin" title="In Outlook übernehmen (.ics)">${icon('download')}</button><button class="icon-btn" data-act="printTermin" title="Drucken / als PDF speichern">${icon('print')}</button><button class="icon-btn danger" data-act="delTermin" title="Löschen">${icon('trash')}</button><button class="icon-btn" data-act="closeModal" title="Schließen (Esc)">${icon('x')}</button></div></div>
  <div class="m-body">${head}
    <div class="meta-grid"><label class="f">Datum<input class="in" type="date" data-bind="${B('datum')}" value="${t.datum}"></label><label class="f">Beginn<input class="in" type="time" data-bind="${B('zeit')}" value="${t.zeit}"></label>
      <label class="f">Dauer (Min.)<input class="in" type="number" min="5" step="5" data-type="num" data-bind="${B('dauer')}" value="${t.dauer}"></label><label class="f">Ort<input class="in" data-bind="${B('ort')}" value="${esc(t.ort)}"></label>
      <label class="f">Status<select class="in" data-bind="${B('status')}">${Object.keys(STATUS).map(v => `<option value="${v}" ${t.status === v ? 'selected' : ''}>${STATUS[v].l}</option>`).join('')}</select></label></div>
    <div id="datWarn">${t.status === 'geplant' ? dateWarn(t.datum) : ''}</div>${s}</div>`;
}
function secTops(t){
  const std = t.kat === 'stationsleiter' ? 'slStandardTops' : t.kat === 'aerzte' ? 'aerzteStandardTops' : null;
  return `<section class="m-sec"><div class="sec-h"><h4>Tagesordnung <small>${t.tops.length} Punkte · abhaken, was besprochen wurde</small></h4>${std ? `<button class="btn sm" data-act="stdTops" data-key="${std}">Standardpunkte einfügen</button>` : ''}</div>
    ${t.tops.length ? `<ol class="tops">${t.tops.map(x => `<li class="${x.erledigt ? 'done' : ''}"><input type="checkbox" title="besprochen" data-bind="termine.${t.id}.tops.#${x.id}.erledigt" ${x.erledigt ? 'checked' : ''}><input class="inline" data-bind="termine.${t.id}.tops.#${x.id}.text" value="${esc(x.text)}"><button class="x" data-act="topDel" data-tid="${x.id}" title="Entfernen">${icon('x')}</button></li>`).join('')}</ol>` : '<p class="muted small" style="margin:0">Noch keine Tagesordnungspunkte.</p>'}

}
function secTeilnehmer(t){

    ${tn.length ? `<div class="tn-list">${tn.map(x => { const p = P(x.pid); return `<div class="tn"><span class="avatar">${initials(p)}</span><span class="tn-name" title="${esc(pname(p))}">${esc(pname(p))}</span><div class="seg">${[['offen','offen'],['anwesend','anwesend'],['entschuldigt','entsch.']].map(([v, l]) => `<button class="st-${v} ${x.st === v ? 'on' : ''}" data-act="tnSt" data-pid="${x.pid}" data-st="${v}">${l}</button>`).join('')}</div><button class="x" data-act="tnDel" data-pid="${x.pid}" title="Entfernen">${icon('x')}</button></div>`; }).join('')}</div>`

function secFortbildung(t){
  const f = t.fb, B = k => `termine.${t.id}.fb.${k}`, c = fbCheck(t);

       <label class="f span2">Kontakt (E-Mail / Telefon)<input class="in" data-bind="${B('refKontakt')}" value="${esc(f.refKontakt)}"></label><datalist id="extRefs">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;
  return `<section class="m-sec"><div class="sec-h"><h4>Referent:in</h4><div class="seg lg">${[['intern','Intern'],['extern','Extern']].map(([v, l]) => `<button class="${f.refTyp === v ? 'on' : ''}" data-act="fbRef" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div class="form-grid">${ref}<label class="f">DFP-Punkte<input class="in" type="number" min="0" step="1" data-type="num" data-bind="${B('dfp')}" value="${f.dfp}"></label><label class="f">Zielgruppe<input class="in" data-bind="${B('zielgruppe')}" value="${esc(f.zielgruppe)}"></label></div></section>
  <section class="m-sec"><div class="sec-h"><h4>Organisation <small>${c.done} von ${c.total} erledigt</small></h4></div><div class="checks">${c.items.map(([k, l]) => `<label class="check"><input type="checkbox" data-bind="${B('check.' + k)}" ${f.check[k] ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></section>`;

function secMag(t){
  const p = P(t.pid), m = t.mag, B = k => `termine.${t.id}.mag.${k}`;
  const prev = DB.termine.filter(x => x.kat === 'mag' && x.pid === t.pid && x.id !== t.id && x.status === 'erledigt' && x.datum < t.datum).sort(byDT).pop();

  return `<section class="m-sec person-strip"><span class="avatar lg">${initials(p)}</span><div><b>${esc(pname(p))}</b><small>${esc(p ? p.funktion : '')}${p && p.eintritt ? ' · im Team seit ' + fmtD(p.eintritt) : ''}</small></div><div class="ps-meta"><small class="muted">Letztes Gespräch</small><b>${p && p.letzteMAG ? fmtD(p.letzteMAG) : '–'}</b></div></section>
  ${prev ? `<section class="m-sec prev"><div class="sec-h"><h4>Vereinbarte Ziele aus dem Gespräch vom ${fmtD(prev.datum)}</h4><button class="link" data-act="openTermin" data-id="${prev.id}">ansehen</button></div>${prev.mag.ziele.length ? `<ul class="goals">${prev.mag.ziele.map(z => `<li>${esc(z.text)}</li>`).join('')}</ul>` : '<p class="muted small" style="margin:0">Keine Ziele dokumentiert.</p>'}</section>` : ''}
  <section class="m-sec"><div class="sec-h"><h4>Gesprächsleitfaden</h4><span class="muted small">Status „Erledigt“ übernimmt das Datum als letztes Gespräch.</span></div><div class="form-grid">

    ${field('wuensche','3. Fortbildungswünsche','Kongresse, Kurse, Zusatzausbildungen')}${field('karriere','4. Entwicklung & Karriere','Ausbildungsstand, Spezialisierung, nächste Schritte')}
    ${field('feedback','5. Feedback an die Führung','Was kann die Abteilungsleitung besser machen?')}

}
function secTodos(src){

  return `<section class="m-sec"><div class="sec-h"><h4>Aufgaben & Vereinbarungen <small>${list.filter(x => !x.erledigt).length} offen</small></h4></div>

    <div class="add-todo"><input class="in" id="tdText" placeholder="Neue Aufgabe … (Enter)" data-enter="todoAddSrc"><select class="in" id="tdPid"><option value="">Verantwortlich …</option>${personOptionsList('')}</select><input class="in" id="tdFrist" type="date" title="Frist"><button class="btn sm primary" data-act="todoAddSrc" title="Aufgabe hinzufügen">${icon('plus')}</button></div></section>`;
}

function mProjekt(M){

      <div class="grow"><span class="lbl">Fortschritt: <b id="fsVal">${p.fortschritt}%</b></span><input type="range" min="0" max="100" step="5" data-type="num" data-bind="${B('fortschritt')}" value="${p.fortschritt}"></div></div></section>

    ${secTodos({typ:'projekt', id:p.id})}
    <section class="m-sec"><div class="sec-h"><h4>Verlauf</h4></div><div class="add-row" style="margin-top:0"><textarea class="in" id="noteNew" rows="2" placeholder="Was ist passiert? Neuer Eintrag …"></textarea><button class="btn sm" data-act="noteAdd">Eintragen</button></div>

  </div>`;
}

function mPerson(M){

function mTodo(M){

    src = `<div class="span2 muted small">Aus: ${tt ? `<button class="link" data-act="openTermin" data-id="${tt.id}">${esc(titleOf(tt))}, ${fmtD(tt.datum)}</button>` : pr ? `<button class="link" data-act="openProjekt" data-id="${pr.id}">Projekt ${esc(pr.name)}</button>` : 'gelöschter Eintrag'}</div>`; }

function ntDefaults(kat, M={}){
  const s = DB.settings.serien[kat], base = {kat, datum:M.datum || nextWorkday(addDays(todayISO(), 7)), titel:'', person:M.person || ''};
  if(s) return Object.assign(base, {zeit:s.zeit, dauer:s.dauer, ort:s.ort});
  if(kat === 'mag') return Object.assign(base, {zeit:'10:00', dauer:45, ort:'Büro Primariat'});
  if(kat === 'jourfixe') return Object.assign(base, {zeit:'10:00', dauer:60, ort:'Büro Primariat'});
  return Object.assign(base, {zeit:'09:00', dauer:60, ort:''});
}
function mNeuTermin(M){
  const d = M.draft || (M.draft = ntDefaults(M.kat || 'sonstig', M));

  else if(d.kat === 'mag') extra = `<label class="f span2">Gespräch mit<select class="in" name="person"><option value="">– bitte wählen –</option>${activeGroup('arzt').map(p => `<option value="${p.id}" ${p.id === d.person ? 'selected' : ''}>${esc(pname(p))}</option>`).join('')}</select></label>`;
